name: Bolso Retro - Gerar APK Android

on:
  push:
    branches:
      - lucas-moreschi16-patch-1
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compilar APK Android
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Reconstruir pastas do projeto Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/br/com/bolsoretro
          mkdir -p app/src/main/res/drawable app/src/main/res/values
          mkdir -p app/src/main/assets/icons
          cp build.gradle app/build.gradle
          cp 'build (3).gradle' build.gradle
          cp MainActivity.java app/src/main/java/br/com/bolsoretro/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp styles.xml app/src/main/res/values/styles.xml
          cp app_icon.png app/src/main/res/drawable/app_icon.png
          cp index.html player.html app.js db.js player.js style.css sw.js manifest.webmanifest app/src/main/assets/
          cp favicon.svg icon-192.png icon-512.png app/src/main/assets/icons/
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/br/com/bolsoretro/MainActivity.java
          test -f app/build.gradle

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar plataforma Android 35
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk BolsoRetro.apk
          python3 -c "import zipfile; z=zipfile.ZipFile('BolsoRetro.apk'); assert {'AndroidManifest.xml','classes.dex'} <= set(z.namelist())"
          sha256sum BolsoRetro.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: BolsoRetro-APK
          path: BolsoRetro.apk
          if-no-files-found: error
          retention-days: 30
