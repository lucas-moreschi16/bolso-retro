name: Bolso Retro - APK offline 1.1
on:
  push:
    branches: [main, lucas-moreschi16-patch-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Compilar APK offline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Preparar Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Incorporar nucleos oficiais GBA e Nintendo DS
        run: python3 scripts/baixar_motor.py
      - name: Verificar integridade dos recursos locais
        shell: bash
        run: |
          set -euo pipefail
          for file in loader.js emulator.min.js emulator.min.css cores/mgba-wasm.data cores/desmume-wasm.data cores/desmume2015-wasm.data cores/cores.json; do
            test -s "app/src/main/assets/emulator-data/$file"
          done
          du -sh app/src/main/assets/emulator-data
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Conferir APK
        run: |
          python3 - <<'PY'
          import zipfile, os, hashlib
          p='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert {'AndroidManifest.xml','classes.dex'} <= names
              for f in ('loader.js','emulator.min.js','emulator.min.css','cores/mgba-wasm.data','cores/desmume-wasm.data','cores/desmume2015-wasm.data'):
                  assert f'assets/emulator-data/{f}' in names, f
          os.rename(p,'BolsoRetro-Offline-1.1.apk')
          print('SHA256:',hashlib.sha256(open('BolsoRetro-Offline-1.1.apk','rb').read()).hexdigest())
          PY
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: BolsoRetro-Offline-1.1
          path: BolsoRetro-Offline-1.1.apk
          if-no-files-found: error
