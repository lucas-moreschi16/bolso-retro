name: Bolso Retro - corrigir emulacao e controles (offline)
on:
  push:
    branches: [main, lucas-moreschi16-patch-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Compilar APK 1.1 com motor embutido
    runs-on: ubuntu-24.04
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Preparar a estrutura Android existente
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/br/com/bolsoretro app/src/main/res/drawable app/src/main/res/values
          mkdir -p app/src/main/assets/icons app/src/main/assets/emulator-data/cores
          cp build.gradle app/build.gradle
          cp 'build (3).gradle' build.gradle
          cp MainActivity.java app/src/main/java/br/com/bolsoretro/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp styles.xml app/src/main/res/values/styles.xml
          cp app_icon.png app/src/main/res/drawable/app_icon.png
          cp index.html player.html app.js db.js player.js style.css sw.js manifest.webmanifest app/src/main/assets/
          cp favicon.svg icon-192.png icon-512.png app/src/main/assets/icons/
      - name: Corrigir carregamento local e deteccao do player
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/player.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';", "window.EJS_pathtodata = new URL('./emulator-data/', location.href).href;")
          s=s.replace("window.EJS_startOnLoaded = false;", "window.EJS_startOnLoaded = false;\n      window.EJS_browserMode = 1; // forca modo mobile e controles de toque\n      window.EJS_threads = false; // nao requer isolamento cross-origin")
          beginning=s.index('      // A complete EmulatorJS /data distribution')
          finish=s.index('    } catch (e) { initialized = false;',beginning)
          s=s[:beginning]+'''      const loader = './emulator-data/loader.js';
          const check = await fetch(loader, {cache:'no-store'});
          if (!check.ok) throw new Error('Motor offline nao foi incluido no APK (loader.js ausente).');
          $('#loadingDescription').textContent = 'Abrindo emulador local. Toque no botao Jogar quando aparecer.';
          window.EJS_ready = () => {
            $('#message').hidden = true;
            $('#gameShell').hidden = false;
          };
          window.EJS_onGameStart = window.EJS_ready;
          window.addEventListener('error', e => {
            console.error('Erro no player', e.message);
            if (!$('#message').hidden) error('Falha do motor local: ' + (e.message || 'desconhecida'));
          });
          window.addEventListener('unhandledrejection', e => {
            console.error('Falha ao iniciar emulador', e.reason);
            if (!$('#message').hidden) error('O núcleo de emulação não iniciou: ' + (e.reason?.message || e.reason || 'erro desconhecido'));
          });
          // Visivel antes da carga para que o motor crie o canvas e controles.
          $('#gameShell').hidden = false;
          await injectScript(loader);
          setTimeout(() => {
            if (!$('#message').hidden) error('O EmulatorJS nao concluiu a inicializacao. Toque em Tentar novamente ou verifique o WebView Android.');
          }, 20000);
          ''' + s[finish:]
          p.write_text(s,encoding='utf-8')
          p=Path('app/build.gradle'); s=p.read_text(); s=s.replace('versionCode 1','versionCode 2').replace("versionName '1.0.0'","versionName '1.1.0'"); p.write_text(s)
          p=Path('app/src/main/AndroidManifest.xml'); s=p.read_text(); s=s.replace('android:usesCleartextTraffic="false"','android:usesCleartextTraffic="false"\n        android:hardwareAccelerated="true"'); p.write_text(s)
          PY
          node --check app/src/main/assets/player.js
      - name: Baixar motor oficial para o APK - sem dependencia de internet ao jogar
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://cdn.emulatorjs.org/stable/data
          TARGET=app/src/main/assets/emulator-data
          mkdir -p "$TARGET/cores" "$TARGET/localization"
          for file in loader.js emulator.min.js emulator.min.css cores/cores.json cores/mgba-wasm.data cores/desmume-wasm.data cores/desmume2015-wasm.data; do
            echo "Baixando $file"
            curl -fsSL --retry 5 --retry-delay 3 --connect-timeout 30 "$BASE/$file" -o "$TARGET/$file"
            test -s "$TARGET/$file"
          done
          for file in localization/pt-BR.json localization/pt.json; do
            curl -fsSL --retry 2 --connect-timeout 30 "$BASE/$file" -o "$TARGET/$file" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          base=Path('app/src/main/assets/emulator-data')
          files={'loader.js':1000,'emulator.min.js':100000,'emulator.min.css':1000,'cores/mgba-wasm.data':500000,'cores/desmume-wasm.data':500000,'cores/desmume2015-wasm.data':500000}
          for name, minimum in files.items():
            p=base/name
            assert p.stat().st_size>minimum, f'{name}: arquivo invalido ({p.stat().st_size} bytes)'
            assert not p.read_bytes()[:20].lower().startswith(b'<!doctype'),f'{name}: HTML incorreto'
            print(name, p.stat().st_size)
          PY
      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar plataforma Android 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Validar arquivos embutidos e preparar download
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
            names=set(z.namelist())
            for name in ['AndroidManifest.xml','classes.dex','assets/emulator-data/loader.js','assets/emulator-data/emulator.min.js','assets/emulator-data/cores/mgba-wasm.data','assets/emulator-data/cores/desmume-wasm.data']:
              assert name in names, f'APK sem {name}'
          PY
          cp app/build/outputs/apk/debug/app-debug.apk BolsoRetro-Offline-1.1.apk
          sha256sum BolsoRetro-Offline-1.1.apk
      - name: Disponibilizar APK corrigido
        uses: actions/upload-artifact@v4
        with:
          name: BolsoRetro-Offline-1.1
          path: BolsoRetro-Offline-1.1.apk
          if-no-files-found: error
          retention-days: 30
