name: Bolso Retro 2.0 - compilar do ZIP (Libretro nativo)
on:
  push:
    branches: [main, lucas-moreschi16-patch-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    name: APK nativo GBA e Nintendo DS
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto nativo enviado
        shell: bash
        run: |
          set -euo pipefail
          test -s BolsoRetro-2.0-Nativo-Libretro.zip
          mkdir -p native
          unzip -q BolsoRetro-2.0-Nativo-Libretro.zip -d native
          test -f native/app/src/main/java/br/com/bolsoretro/GameActivity.kt
          test -f native/app/src/main/assets/native-bridge.js
      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Baixar mGBA e melonDS nativos para arm64
        working-directory: native
        run: bash scripts/download_cores.sh
      - name: Compilar APK nativo
        working-directory: native
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Preparar artefato
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,hashlib,shutil
          p='native/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              for f in ['AndroidManifest.xml','classes.dex',
                       'lib/arm64-v8a/liblibretrodroid.so',
                       'lib/arm64-v8a/libmgba_libretro_android.so',
                       'lib/arm64-v8a/libmelondsds_libretro_android.so']:
                  assert f in names, f
          shutil.copyfile(p, 'BolsoRetro-Nativo-2.0.apk')
          print('APK SHA256:',hashlib.sha256(open('BolsoRetro-Nativo-2.0.apk','rb').read()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BolsoRetro-Nativo-2.0
          path: BolsoRetro-Nativo-2.0.apk
          if-no-files-found: error
          retention-days: 30
